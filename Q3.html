<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q3 - Time Table</title>

    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        div{
            text-align:center;
            margin-left:20%;
            margin-right:15%;
            margin-top:15%;
            padding: 1%;
            padding-top:0%;
        }

        table{
            margin-left: 32%;
        }
    </style>

</head>
<body>
    <div>
        <p>My Time Table</p>
        <table border="3">
            <tr>
                <th rowspan="2">Day</th>
                <th colspan="2">Session</th>
            </tr>

            <tr>
                <th>Schedule</th>
                <th>Course Name</th>
            </tr>

            <tr>
                <td>Sunday</td>
                <td>16:00 - 16:50</td>
                <td>Web Technology</td>
            </tr>

            <tr>
                <td>Sunday</td>
                <td>17:00 - 17:50</td>
                <td>Network Management</td>
            </tr>

            <tr>
                <td>Monday</td>
                <td>18:00 - 18:50</td>
                <td>IT Project Management</td>
            </tr>
        </table>
    </div>
</body>
</html>
